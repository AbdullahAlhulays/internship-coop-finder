<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { background: #f7f6ef; color: #23432e; font-family: Arial, sans-serif; }
      .frame { position: relative; width: 100%; height: 100%; padding: 82px 86px; background: radial-gradient(circle at 95% 8%, #e7eddd 0, transparent 38%), #f7f6ef; }
      .brand { display: flex; align-items: center; gap: 24px; }
      .brand img { width: 104px; height: 104px; }
      .name { font-size: 56px; font-weight: 800; letter-spacing: -2px; }
      .arabic { margin-left: auto; font-size: 32px; font-weight: 700; }
      .rule { width: 88px; height: 8px; margin-top: 60px; border-radius: 4px; background: #c99a3e; }
      h1 { max-width: 850px; margin: 26px 0 0; font-size: 66px; line-height: 1.1; letter-spacing: -2px; }
      p { margin: 28px 0 0; font-size: 29px; line-height: 1.35; color: #53665a; }
      .footer { position: absolute; bottom: 51px; left: 86px; font-size: 22px; font-weight: 700; color: #31523a; }
      .accent { position: absolute; width: 340px; height: 340px; right: -140px; bottom: -150px; border: 55px solid #d7e3d1; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand"><img src="../public/fursati-logo.svg" alt="" /><span class="name">Fursati</span><span class="arabic" lang="ar" dir="rtl">فرصتي</span></div>
      <div class="rule"></div>
      <h1>Internships &amp; CO-OP opportunities</h1>
      <p>Explore student training opportunities in Saudi Arabia.</p>
      <div class="footer">internship-coop-finder.vercel.app</div>
      <div class="accent"></div>
    </div>
  </body>
</html>
