# Save this file as .github/workflows/create-candidate.yml, right next
# to process-approval.yml (same repo, same folder). Triggered by the
# /new Telegram flow (see telegram-webhook.ts's finishCreation) once
# all six fields have been collected.
#
# Same two-step shape as process-approval.yml, for the same reason:
# create_candidate.py --defer-send writes the candidate with a durable
# delivery.status=queued marker but does NOT send the Telegram review
# card yet, because nothing is real until the commit below is pushed.
# A failed Telegram send stays queued for the hourly scanner to recover.

name: Create Candidate From Telegram

on:
  repository_dispatch:
    types: [telegram-create]

permissions:
  contents: write # needed to commit and push state/pending.json

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (create_candidate.py -> read_companies.py shells out to node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r agent/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "opportunity-agent"
          git config user.email "actions@users.noreply.github.com"

      # Same push-collision retry as process-approval.yml's "Apply the
      # decision" step, and the same reason: a /new draft finishing at
      # the same moment an Approve/Reject (or another /new) is being
      # processed would otherwise silently lose whichever one pushed
      # second. On a rejected push, reset to the fresh remote and redo
      # the whole thing against it -- this step only ever writes
      # state/pending.json, never companies.js, so a clean redo here is
      # cheap and cannot half-apply anything to the live site.
      - name: Create the candidate, then commit and push (retrying on collisions)
        id: create
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRAFT_ID: ${{ github.event.client_payload.draft_id }}
          COMPANY: ${{ github.event.client_payload.company }}
          TYPE: ${{ github.event.client_payload.type }}
          URL: ${{ github.event.client_payload.url }}
          LOCATION: ${{ github.event.client_payload.location }}
          DEADLINE: ${{ github.event.client_payload.deadline }}
          REQUIRES_LETTER: ${{ github.event.client_payload.requires_letter }}
        run: |
          set -euo pipefail

          LETTER_FLAG=""
          if [ "$REQUIRES_LETTER" = "true" ]; then
            LETTER_FLAG="--requires-letter"
          fi

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt $attempt of $MAX_ATTEMPTS"

            if [ "$attempt" -gt 1 ]; then
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi

            # --defer-send: add to state/pending.json, but don't send the
            # Telegram review card yet -- nothing is real until the push
            # below succeeds. A genuine problem (duplicate link, invalid
            # type, read_companies failure) raises here and Abood is
            # already told why by create_candidate.py itself -- that's
            # not deferred, since there's nothing to roll back on a
            # failure that never wrote anything.
            python agent/create_candidate.py "$DRAFT_ID" "$COMPANY" "$TYPE" "$URL" \
              --location "$LOCATION" --deadline "$DEADLINE" $LETTER_FLAG --defer-send

            # Stage only the file this command is allowed to change.
            # This prevents Python bytecode or other runner-generated
            # files from leaking into production commits.
            git add -- state/pending.json
            if git diff --cached --quiet; then
              echo "Nothing to commit -- this draft was already saved by an earlier attempt."
              break
            fi

            git commit -m "Telegram /new: $DRAFT_ID ($COMPANY)"
            if git push; then
              echo "Pushed successfully."
              break
            fi

            echo "Push rejected -- another approval or creation landed first."
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              python agent/notify.py "$DRAFT_ID" --failed \
                --detail "couldn't save after $MAX_ATTEMPTS tries (too much happening at once) -- please try /new again"
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 2 ))
            echo "::endgroup::"
          done

      # Only now is the candidate genuinely committed and pushed. A
      # failure leaves it queued in the repo, so the hourly scanner can
      # recover it without any terminal command.
      - name: Deliver the queued review card
        id: delivery
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRAFT_ID: ${{ github.event.client_payload.draft_id }}
        run: |
          python agent/deliver_pending.py \
            --candidate-id "$DRAFT_ID" \
            --attempts 3 \
            --minimum-age-seconds 600 \
            --receipts-file "$RUNNER_TEMP/delivery-receipts.json"

      - name: Persist the delivery receipt
        if: always() && steps.create.outcome == 'success'
        env:
          DRAFT_ID: ${{ github.event.client_payload.draft_id }}
        run: |
          set -euo pipefail
          RECEIPTS_FILE="$RUNNER_TEMP/delivery-receipts.json"
          if [ ! -f "$RECEIPTS_FILE" ] || [ "$(jq 'length' "$RECEIPTS_FILE")" -eq 0 ]; then
            echo "No new Telegram delivery receipt to persist."
            exit 0
          fi

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Receipt push attempt $attempt of $MAX_ATTEMPTS"
            if [ "$attempt" -gt 1 ]; then
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi
            python agent/deliver_pending.py --apply-receipts "$RECEIPTS_FILE"

            git add -- state/pending.json
            if git diff --cached --quiet; then
              echo "Receipt was already applied or the card was already handled."
              echo "::endgroup::"
              break
            fi

            git commit -m "Record Telegram delivery: $DRAFT_ID"
            if git push; then
              echo "Delivery receipt pushed successfully."
              echo "::endgroup::"
              break
            fi

            echo "Receipt push collided with another state update."
            echo "::endgroup::"
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Could not persist the Telegram delivery receipt after $MAX_ATTEMPTS attempts." >&2
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 2 ))
          done

      - name: Report deferred delivery
        if: steps.delivery.outcome == 'failure'
        run: |
          echo "Telegram delivery failed; this card remains queued and will retry automatically." >&2
          exit 1

# FOLDER LAYOUT: identical to process-approval.yml's -- see the note at
# the bottom of that file. This workflow and create_candidate.py both
# assume they're running from the repo root, with agent/ holding the
# Python scripts (same layout, same repo, no new folders needed).
