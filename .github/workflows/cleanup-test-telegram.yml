name: Remove Telegram Test Messages

on:
  repository_dispatch:
    types: [cleanup-telegram-test-messages]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the two synthetic test messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is missing}"
          : "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is missing}"

          for message_id in 31 32; do
            response="$(curl --silent --show-error \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "message_id=${message_id}")"
            ok="$(jq -r '.ok' <<<"$response")"
            description="$(jq -r '.description // ""' <<<"$response")"
            if [ "$ok" != "true" ] && [[ "$description" != *"message to delete not found"* ]]; then
              echo "Telegram could not delete test message ${message_id}: ${description}" >&2
              exit 1
            fi
            echo "Test message ${message_id} is removed."
          done
