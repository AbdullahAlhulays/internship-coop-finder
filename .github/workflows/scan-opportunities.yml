name: Scan Telegram Opportunities

on:
  schedule:
    # Hourly, offset from the top of the hour to avoid GitHub's busiest
    # scheduler minute. GitHub Actions cron uses UTC.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNELS: "SALTRAI nobthacv1 cooptraning_inksa"
      POST_LIMIT: "20"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (run.py validates companies.js with Node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r agent/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "opportunity-agent"
          git config user.email "actions@users.noreply.github.com"

      # The scanner writes pending.json and seen.json first, including a
      # durable delivery.status=queued marker, but defers
      # Telegram delivery until that state is committed and pushed. If
      # an approval or /new card lands at the same time, reset to the
      # new remote state and rerun without ever sending a phantom card.
      - name: Scan channels, then commit and push state
        id: scan
        run: |
          set -euo pipefail
          : "${GROQ_API_KEY:?GROQ_API_KEY is missing}"
          : "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is missing}"
          : "${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is missing}"

          CREATED_IDS_FILE="$RUNNER_TEMP/created-ids.txt"
          FAILURE_COUNT_FILE="$RUNNER_TEMP/extraction-failures.txt"
          MAX_ATTEMPTS=5

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Attempt $attempt of $MAX_ATTEMPTS"

            if [ "$attempt" -gt 1 ]; then
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi

            : > "$CREATED_IDS_FILE"
            echo 0 > "$FAILURE_COUNT_FILE"

            for channel in $CHANNELS; do
              if [[ ! "$channel" =~ ^[A-Za-z0-9_]+$ ]]; then
                echo "Invalid Telegram channel username: $channel" >&2
                exit 1
              fi

              ids_json="$RUNNER_TEMP/${channel}-created.json"
              summary_json="$RUNNER_TEMP/${channel}-summary.json"
              python agent/run.py \
                --channel "$channel" \
                --limit "$POST_LIMIT" \
                --defer-send \
                --extraction-attempts 3 \
                --created-ids-file "$ids_json" \
                --summary-file "$summary_json"

              jq -r '.[]' "$ids_json" >> "$CREATED_IDS_FILE"
              current_failures=$(cat "$FAILURE_COUNT_FILE")
              channel_failures=$(jq -r '.failed' "$summary_json")
              echo $((current_failures + channel_failures)) > "$FAILURE_COUNT_FILE"
            done

            sort -u "$CREATED_IDS_FILE" -o "$CREATED_IDS_FILE"
            git add -- state/pending.json state/seen.json

            if git diff --cached --quiet; then
              echo "No new scanner state to commit."
              echo "::endgroup::"
              break
            fi

            git commit -m "Hourly opportunity scan: $GITHUB_RUN_ID"
            if git push; then
              echo "Scanner state pushed successfully."
              echo "::endgroup::"
              break
            fi

            echo "Push rejected because another workflow updated state first."
            echo "::endgroup::"
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Scanner could not save state after $MAX_ATTEMPTS attempts." >&2
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 2 ))
          done

          echo "created_count=$(grep -c . "$CREATED_IDS_FILE" || true)" >> "$GITHUB_OUTPUT"
          echo "extraction_failures=$(cat "$FAILURE_COUNT_FILE")" >> "$GITHUB_OUTPUT"

      # Deliver this run's cards plus queued cards left by an earlier
      # Telegram outage. A 10-minute age guard prevents this scanner from
      # racing a fresh /new workflow that is still delivering its own card.
      # Successful receipts update pending.json locally; failures remain
      # queued and make the job fail only after successes are persisted.
      - name: Deliver queued Telegram cards
        id: delivery
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r candidate_id; do
            if [ -n "$candidate_id" ]; then
              args+=(--candidate-id "$candidate_id")
            fi
          done < "$RUNNER_TEMP/created-ids.txt"

          python agent/deliver_pending.py \
            "${args[@]}" \
            --attempts 3 \
            --minimum-age-seconds 600 \
            --receipts-file "$RUNNER_TEMP/delivery-receipts.json" \
            --summary-file "$RUNNER_TEMP/delivery-summary.json"

      # Telegram has already accepted these messages. If another workflow
      # pushed first, reset to that fresh state and replay only the saved
      # receipts -- never call Telegram a second time because of a git
      # collision.
      - name: Persist successful delivery receipts
        if: always() && steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          RECEIPTS_FILE="$RUNNER_TEMP/delivery-receipts.json"
          if [ ! -f "$RECEIPTS_FILE" ] || [ "$(jq 'length' "$RECEIPTS_FILE")" -eq 0 ]; then
            echo "No new Telegram delivery receipts to persist."
            exit 0
          fi

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Receipt push attempt $attempt of $MAX_ATTEMPTS"
            if [ "$attempt" -gt 1 ]; then
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
            fi
            python agent/deliver_pending.py --apply-receipts "$RECEIPTS_FILE"

            git add -- state/pending.json
            if git diff --cached --quiet; then
              echo "Receipts were already applied or their cards were already handled."
              echo "::endgroup::"
              break
            fi

            git commit -m "Record Telegram deliveries: $GITHUB_RUN_ID"
            if git push; then
              echo "Delivery receipts pushed successfully."
              echo "::endgroup::"
              break
            fi

            echo "Receipt push collided with another state update."
            echo "::endgroup::"
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Could not persist Telegram delivery receipts after $MAX_ATTEMPTS attempts." >&2
              exit 1
            fi
            sleep $(( (RANDOM % 5) + 2 ))
          done

      - name: Report delivery failures
        if: steps.delivery.outcome == 'failure'
        run: |
          echo "One or more Telegram cards remain queued and will retry automatically next hour." >&2
          exit 1

      - name: Report extraction failures
        if: steps.scan.outputs.extraction_failures != '0'
        run: |
          echo "${{ steps.scan.outputs.extraction_failures }} post(s) could not be extracted after retries." >&2
          echo "They were deliberately left unseen and will be retried next hour." >&2
          exit 1
